services:
  backend:
    image: node:24-alpine
    working_dir: /app
    command: npm run dev
    environment:
      PORT: 3000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"


  frontend:
    image: node:24-alpine
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules: